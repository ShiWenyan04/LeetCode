<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Sync Dashboard</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --surface: #ffffff;
            --soft: #f8fafc;
            --text: #17202a;
            --muted: #64748b;
            --line: #d8e0ea;
            --primary: #1764e8;
            --primary-soft: #e8f1ff;
            --green: #0f8a4b;
            --green-soft: #e4f8ed;
            --amber: #a16207;
            --amber-soft: #fff6d7;
            --red: #b42318;
            --red-soft: #ffe8e6;
            --ink: #111827;
            --shadow: 0 16px 40px rgba(30, 41, 59, .10);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
        }

        button,
        input,
        select {
            font: inherit;
        }

        .app {
            width: min(1320px, calc(100% - 28px));
            margin: 0 auto;
            padding: 24px 0 36px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: var(--ink);
            color: #fff;
            font-weight: 800;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 0;
        }

        h2 {
            font-size: 17px;
            letter-spacing: 0;
        }

        h3 {
            font-size: 14px;
            letter-spacing: 0;
        }

        .muted {
            color: var(--muted);
        }

        .small {
            font-size: 13px;
        }

        .layout {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr) 330px;
            gap: 14px;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 16px;
        }

        .stack {
            display: grid;
            gap: 14px;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px;
            display: grid;
            gap: 6px;
        }

        .stat strong {
            font-size: 25px;
            font-variant-numeric: tabular-nums;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: var(--muted);
            font-weight: 650;
        }

        input,
        select {
            width: 100%;
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text);
            background: #fff;
        }

        input[type="checkbox"] {
            width: auto;
            min-height: 0;
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: 14px;
        }

        .btn {
            min-height: 38px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .btn:hover {
            border-color: var(--primary);
        }

        .btn.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn.soft {
            background: var(--soft);
        }

        .btn:disabled {
            opacity: .62;
            cursor: wait;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modes {
            display: grid;
            gap: 8px;
        }

        .modes .btn {
            justify-content: flex-start;
        }

        .modes .btn[aria-pressed="true"] {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 24px;
            border-radius: 999px;
            padding: 2px 9px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .ok {
            color: var(--green);
            background: var(--green-soft);
        }

        .warn {
            color: var(--amber);
            background: var(--amber-soft);
        }

        .err {
            color: var(--red);
            background: var(--red-soft);
        }

        .repo-row,
        .diag-item {
            display: grid;
            gap: 6px;
            padding: 10px;
            border-radius: 8px;
            background: var(--soft);
            border: 1px solid var(--line);
        }

        .repo-row code,
        .diag-item code {
            overflow-wrap: anywhere;
        }

        code,
        pre {
            font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
        }

        pre {
            margin: 0;
            min-height: 84px;
            max-height: 480px;
            overflow: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            padding: 13px;
            color: #dbeafe;
            background: var(--ink);
            border-radius: 8px;
            border: 1px solid #253047;
            font-size: 13px;
            line-height: 1.55;
        }

        .diag-list {
            display: grid;
            gap: 8px;
            max-height: 560px;
            overflow: auto;
        }

        .diag-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .toast {
            min-height: 22px;
            color: var(--muted);
        }

        .running {
            display: none;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            font-weight: 800;
        }

        .running.show {
            display: flex;
        }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid var(--primary-soft);
            border-top-color: var(--primary);
            border-radius: 999px;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1120px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 620px) {
            .app {
                width: min(100% - 18px, 1320px);
                padding-top: 12px;
            }

            .topbar,
            .section-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats,
            .two {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main class="app">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">LC</div>
            <div>
                <h1>LeetCode Sync Dashboard</h1>
                <p class="muted small">leetcode.cn 题解同步控制台</p>
            </div>
        </div>
        <div class="actions">
            <button class="btn soft" id="refreshBtn" type="button">刷新状态</button>
            <button class="btn soft" id="diagBtn" type="button">运行诊断</button>
            <button class="btn" id="copyBtn" type="button">复制命令</button>
            <button class="btn" id="cancelBtn" type="button" disabled>停止任务</button>
            <button class="btn primary" id="runBtn" type="button">运行同步</button>
        </div>
    </header>

    <div class="stats">
        <div class="stat">
            <span class="muted small" id="outputDirLabel">AutoSync 题目</span>
            <strong id="problemCount">0</strong>
        </div>
        <div class="stat">
            <span class="muted small">已记录提交</span>
            <strong id="submissionCount">0</strong>
        </div>
        <div class="stat">
            <span class="muted small">工作区变更</span>
            <strong id="dirtyCount">0</strong>
        </div>
        <div class="stat">
            <span class="muted small">诊断</span>
            <strong id="diagCount">-</strong>
        </div>
    </div>

    <div class="layout" style="margin-top: 14px;">
        <aside class="stack">
            <section class="panel stack">
                <div class="section-head">
                    <h2>状态</h2>
                    <span class="badge warn" id="dirtyStatus">检查中</span>
                </div>
                <div class="repo-row">
                    <span class="muted small">题解仓库</span>
                    <code id="repoRoot">读取中...</code>
                </div>
                <div class="repo-row">
                    <span class="muted small">分支</span>
                    <code id="branch">-</code>
                </div>
                <div class="two">
                    <div class="repo-row">
                        <span class="muted small">脚本</span>
                        <span class="badge warn" id="scriptStatus">检查中</span>
                    </div>
                    <div class="repo-row">
                        <span class="muted small">Cookie</span>
                        <span class="badge warn" id="cookieStatus">检查中</span>
                    </div>
                </div>
            </section>

            <section class="panel stack">
                <div class="section-head">
                    <h2>本地配置</h2>
                    <button class="btn soft" id="saveConfigBtn" type="button">保存</button>
                </div>
                <div class="field">
                    <label for="configRepoRoot">题解仓库路径</label>
                    <input id="configRepoRoot" autocomplete="off">
                </div>
                <div class="field">
                    <label for="configOutputDir">输出目录</label>
                    <input id="configOutputDir" autocomplete="off" placeholder="AutoSync">
                </div>
                <div class="field">
                    <label for="configSyncScript">同步脚本路径</label>
                    <input id="configSyncScript" autocomplete="off" placeholder="tools/LeetCodeCnSync.java">
                </div>
                <div class="field">
                    <label for="configSession">LEETCODE_SESSION</label>
                    <input id="configSession" autocomplete="off" placeholder="留空则使用环境变量">
                </div>
                <div class="field">
                    <label for="configCsrf">CSRF_TOKEN / csrftoken</label>
                    <input id="configCsrf" autocomplete="off" placeholder="留空则使用环境变量">
                </div>
                <p class="muted small" id="configPath">配置文件：-</p>
                <p class="toast small" id="configToast"></p>
            </section>
        </aside>

        <section class="stack">
            <section class="panel stack">
                <div class="section-head">
                    <h2>运行配置</h2>
                    <span class="badge ok" id="modeBadge">预览模式</span>
                </div>
                <div class="two">
                    <div class="field">
                        <label for="scope">同步范围</label>
                        <select id="scope">
                            <option value="recent">最近提交</option>
                            <option value="all">全量历史</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="limit">最近数量</label>
                        <input id="limit" type="number" min="1" max="5000" value="20">
                    </div>
                    <div class="field">
                        <label for="maxSync">本批最多同步</label>
                        <input id="maxSync" type="number" min="0" max="5000" value="30">
                    </div>
                    <label class="check" style="align-self: end;">
                        <input id="debug" type="checkbox">
                        显示调试输出
                    </label>
                    <label class="check">
                        <input id="resetCursor" type="checkbox">
                        重置全量扫描游标
                    </label>
                </div>

                <div class="modes" role="group" aria-label="执行模式">
                    <button class="btn" type="button" data-mode="preview" aria-pressed="true">只预览，不写入</button>
                    <button class="btn" type="button" data-mode="local" aria-pressed="false">写入并本地提交</button>
                    <button class="btn" type="button" data-mode="push" aria-pressed="false">写入、提交并推送</button>
                </div>
            </section>

            <section class="panel stack">
                <div class="section-head">
                    <h2>命令</h2>
                    <span class="running" id="running"><span class="spinner"></span>运行中</span>
                </div>
                <pre><code id="commandText">生成中...</code></pre>
                <p class="toast small" id="toast"></p>
            </section>

            <section class="panel stack">
                <div class="section-head">
                    <h2>运行日志</h2>
                    <span class="muted small" id="lastChecked">尚未运行</span>
                </div>
                <pre><code id="logText">点击“运行同步”后，这里会显示实时日志。</code></pre>
            </section>
        </section>

        <aside class="panel stack">
            <div class="section-head">
                <h2>诊断</h2>
                <span class="badge warn" id="diagBadge">未运行</span>
            </div>
            <div class="diag-list" id="diagList">
                <div class="diag-item">
                    <div class="diag-title">
                        <strong>等待检查</strong>
                        <span class="badge warn">pending</span>
                    </div>
                    <p class="muted small">点击“运行诊断”查看环境、仓库、Cookie 和 Git 状态。</p>
                </div>
            </div>
        </aside>
    </div>
</main>

<script>
    const state = {
        mode: 'preview',
        status: null,
        command: '',
        jobId: null,
        pollTimer: null,
        promptedJobs: new Set()
    };

    const el = {
        refreshBtn: document.getElementById('refreshBtn'),
        diagBtn: document.getElementById('diagBtn'),
        copyBtn: document.getElementById('copyBtn'),
        cancelBtn: document.getElementById('cancelBtn'),
        runBtn: document.getElementById('runBtn'),
        saveConfigBtn: document.getElementById('saveConfigBtn'),
        repoRoot: document.getElementById('repoRoot'),
        branch: document.getElementById('branch'),
        scriptStatus: document.getElementById('scriptStatus'),
        cookieStatus: document.getElementById('cookieStatus'),
        dirtyStatus: document.getElementById('dirtyStatus'),
        outputDirLabel: document.getElementById('outputDirLabel'),
        problemCount: document.getElementById('problemCount'),
        submissionCount: document.getElementById('submissionCount'),
        dirtyCount: document.getElementById('dirtyCount'),
        diagCount: document.getElementById('diagCount'),
        diagBadge: document.getElementById('diagBadge'),
        diagList: document.getElementById('diagList'),
        modeBadge: document.getElementById('modeBadge'),
        scope: document.getElementById('scope'),
        limit: document.getElementById('limit'),
        maxSync: document.getElementById('maxSync'),
        debug: document.getElementById('debug'),
        resetCursor: document.getElementById('resetCursor'),
        commandText: document.getElementById('commandText'),
        toast: document.getElementById('toast'),
        running: document.getElementById('running'),
        logText: document.getElementById('logText'),
        lastChecked: document.getElementById('lastChecked'),
        configRepoRoot: document.getElementById('configRepoRoot'),
        configOutputDir: document.getElementById('configOutputDir'),
        configSyncScript: document.getElementById('configSyncScript'),
        configSession: document.getElementById('configSession'),
        configCsrf: document.getElementById('configCsrf'),
        configPath: document.getElementById('configPath'),
        configToast: document.getElementById('configToast')
    };

    function requestBody() {
        return {
            scope: el.scope.value,
            limit: Number(el.limit.value || 20),
            maxSync: Number(el.maxSync.value || 0),
            mode: state.mode,
            debug: el.debug.checked,
            resetCursor: el.resetCursor.checked
        };
    }

    function setBadge(node, severity, text) {
        node.textContent = text;
        node.className = 'badge ' + (severity === 'ok' ? 'ok' : severity === 'warn' ? 'warn' : 'err');
    }

    async function refreshAll() {
        await Promise.all([refreshConfig(), refreshStatus(), refreshCommand()]);
    }

    async function refreshConfig() {
        const response = await fetch('/api/config');
        const data = await response.json();
        el.configRepoRoot.value = data.repoRoot || '';
        el.configOutputDir.value = data.outputDir || 'AutoSync';
        el.configSyncScript.value = data.syncScript || 'tools/LeetCodeCnSync.java';
        el.configSession.placeholder = data.leetcodeSessionPresent ? data.leetcodeSessionMask : '留空则使用环境变量';
        el.configCsrf.placeholder = data.csrfTokenPresent ? data.csrfTokenMask : '留空则使用环境变量';
        el.configPath.textContent = '配置文件：' + data.configPath;
    }

    async function saveConfig() {
        el.configToast.textContent = '保存中...';
        const body = {
            repoRoot: el.configRepoRoot.value.trim(),
            outputDir: el.configOutputDir.value.trim(),
            syncScript: el.configSyncScript.value.trim(),
            leetcodeSession: el.configSession.value.trim(),
            csrfToken: el.configCsrf.value.trim()
        };
        const response = await fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        if (!response.ok) {
            el.configToast.textContent = '保存失败';
            return;
        }
        el.configSession.value = '';
        el.configCsrf.value = '';
        el.configToast.textContent = '已保存';
        await refreshAll();
        await runDiagnostics();
    }

    async function refreshStatus() {
        const response = await fetch('/api/status');
        const data = await response.json();
        state.status = data;
        el.repoRoot.textContent = data.repoRoot;
        el.branch.textContent = data.branch || '-';
        el.outputDirLabel.textContent = (data.outputDir || 'AutoSync') + ' 题目';
        el.problemCount.textContent = data.autoSyncProblemCount;
        el.submissionCount.textContent = data.syncedSubmissionCount;
        el.dirtyCount.textContent = data.dirtyFileCount;
        setBadge(el.scriptStatus, data.syncScriptFound ? 'ok' : 'err', data.syncScriptFound ? '已找到' : '缺失');
        setBadge(el.cookieStatus, data.leetcodeSessionPresent && data.csrfTokenPresent ? 'ok' : 'err',
            data.leetcodeSessionPresent && data.csrfTokenPresent ? '已配置' : '缺失');
        setBadge(el.dirtyStatus, data.dirtyFileCount === 0 ? 'ok' : 'warn',
            data.dirtyFileCount === 0 ? '干净' : data.dirtyFileCount + ' 个变更');
        el.lastChecked.textContent = '状态检查：' + new Date(data.checkedAt).toLocaleString();
    }

    async function runDiagnostics() {
        setBadge(el.diagBadge, 'warn', '检查中');
        const response = await fetch('/api/diagnostics');
        const data = await response.json();
        el.diagCount.textContent = data.errors + '/' + data.warnings;
        setBadge(el.diagBadge, data.ok ? 'ok' : 'err', data.ok ? '通过' : data.errors + ' 个问题');
        el.diagList.innerHTML = '';
        data.items.forEach(item => {
            const node = document.createElement('div');
            node.className = 'diag-item';
            const badgeClass = item.severity === 'ok' ? 'ok' : item.severity === 'warn' ? 'warn' : 'err';
            node.innerHTML = `
                <div class="diag-title">
                    <strong>${escapeHtml(item.label)}</strong>
                    <span class="badge ${badgeClass}">${escapeHtml(item.severity)}</span>
                </div>
                <code>${escapeHtml(item.detail || '-')}</code>
                <p class="muted small">${escapeHtml(item.ok ? '无需处理' : item.fix)}</p>
            `;
            el.diagList.appendChild(node);
        });
    }

    async function refreshCommand() {
        el.limit.disabled = el.scope.value === 'all';
        const response = await fetch('/api/command', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(requestBody())
        });
        const data = await response.json();
        state.command = data.command;
        el.commandText.textContent = data.command;
    }

    function updateMode(nextMode) {
        state.mode = nextMode;
        document.querySelectorAll('[data-mode]').forEach(button => {
            button.setAttribute('aria-pressed', String(button.dataset.mode === nextMode));
        });
        const names = {preview: '预览模式', local: '本地提交', push: '自动推送'};
        el.modeBadge.textContent = names[nextMode] || nextMode;
        refreshCommand();
    }

    async function runSync() {
        setRunning(true);
        stopPolling();
        el.logText.textContent = '正在启动后台任务...';
        el.toast.textContent = '';
        try {
            const response = await fetch('/api/sync', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(requestBody())
            });
            if (!response.ok) {
                throw new Error('启动失败：' + response.status);
            }
            const data = await response.json();
            state.jobId = data.jobId;
            renderJob(data);
            startPolling();
        } catch (error) {
            el.logText.textContent = String(error);
            el.toast.textContent = '请求失败';
            setRunning(false);
        }
    }

    function startPolling() {
        stopPolling();
        state.pollTimer = window.setInterval(pollJob, 1000);
        pollJob();
    }

    function stopPolling() {
        if (state.pollTimer) {
            window.clearInterval(state.pollTimer);
            state.pollTimer = null;
        }
    }

    async function pollJob() {
        if (!state.jobId) {
            return;
        }
        try {
            const response = await fetch('/api/sync/' + encodeURIComponent(state.jobId));
            if (!response.ok) {
                throw new Error('任务不存在');
            }
            const data = await response.json();
            renderJob(data);
            if (!data.running) {
                stopPolling();
                state.jobId = null;
                setRunning(false);
                el.resetCursor.checked = false;
                await refreshStatus();
                await askForNextBatch(data);
            }
        } catch (error) {
            stopPolling();
            setRunning(false);
            el.toast.textContent = '刷新日志失败';
        }
    }

    function renderJob(data) {
        const chunks = [
            '$ ' + data.command,
            '',
            'jobId=' + data.jobId,
            data.running ? 'status=running' : 'status=finished',
            '',
            data.stdout || '',
            data.stderr ? '\n[stderr]\n' + data.stderr : '',
            data.exitCode === null || data.exitCode === undefined ? '' : '\nexitCode=' + data.exitCode
        ];
        el.logText.textContent = chunks.join('\n').trim();
        el.logText.parentElement.scrollTop = el.logText.parentElement.scrollHeight;
        el.toast.textContent = data.running ? '任务运行中，日志每秒刷新' : (data.success ? '运行完成' : '运行失败，查看日志');
        if (data.checkedAt) {
            el.lastChecked.textContent = '日志刷新：' + new Date(data.checkedAt).toLocaleString();
        }
    }

    async function askForNextBatch(data) {
        if (!shouldAskForNextBatch(data)) {
            return;
        }
        state.promptedJobs.add(data.jobId);
        const ok = window.confirm('本批同步已经完成。是否继续下一批？');
        if (ok) {
            el.toast.textContent = '继续同步下一批...';
            await runSync();
        } else {
            el.toast.textContent = '已停在当前批次';
        }
    }

    function shouldAskForNextBatch(data) {
        const maxSync = Number(el.maxSync.value || 0);
        return data
            && data.success
            && !state.promptedJobs.has(data.jobId)
            && el.scope.value === 'all'
            && state.mode !== 'preview'
            && maxSync > 0
            && (data.stdout || '').includes('Reached --max-sync');
    }

    async function cancelSync() {
        if (!state.jobId) {
            return;
        }
        try {
            const response = await fetch('/api/sync/' + encodeURIComponent(state.jobId) + '/cancel', {method: 'POST'});
            const data = await response.json();
            renderJob(data);
        } catch (error) {
            el.toast.textContent = '停止失败';
        }
    }

    function setRunning(running) {
        el.running.classList.toggle('show', running);
        el.runBtn.disabled = running;
        el.cancelBtn.disabled = !running;
    }

    async function copyCommand() {
        await navigator.clipboard.writeText(state.command);
        el.toast.textContent = '命令已复制';
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    document.querySelectorAll('[data-mode]').forEach(button => {
        button.addEventListener('click', () => updateMode(button.dataset.mode));
    });
    [el.scope, el.limit, el.maxSync, el.debug, el.resetCursor].forEach(control => {
        control.addEventListener('input', refreshCommand);
    });
    el.refreshBtn.addEventListener('click', refreshAll);
    el.diagBtn.addEventListener('click', runDiagnostics);
    el.copyBtn.addEventListener('click', copyCommand);
    el.cancelBtn.addEventListener('click', cancelSync);
    el.runBtn.addEventListener('click', runSync);
    el.saveConfigBtn.addEventListener('click', saveConfig);

    refreshAll()
        .then(runDiagnostics)
        .catch(error => {
            el.logText.textContent = '初始化失败：' + error;
        });
</script>
</body>
</html>
