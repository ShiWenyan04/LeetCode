server.port=8848
server.address=127.0.0.1
spring.application.name=leetcode-sync-dashboard

# Target git repository where generated LeetCode solutions are saved.
# Default ".." means the parent directory of this dashboard project.
# Use an absolute path when this dashboard is copied to a standalone project.
leetcode.repo-root=..

# Directory inside leetcode.repo-root for generated solutions.
leetcode.output-dir=AutoSync

# Sync script location. Relative paths are resolved from this dashboard project directory.
leetcode.sync-script=tools/LeetCodeCnSync.java
